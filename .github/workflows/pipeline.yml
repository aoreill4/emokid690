name: TikTok pipeline

# Weekly ingest orchestration: pulls the past week's videos (with comments +
# replies), transcribes them from TikTok captions, segments transcripts into
# jokes, attributes comments to jokes, scores sentiment, and syncs everything to
# Supabase. GitHub-hosted runners have normal internet access (unlike the Claude
# Code sandbox), so they can reach api.scrapecreators.com and Supabase.
#
# The email report is a SEPARATE workflow (email-report.yml) that fires
# automatically after this one succeeds.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SCRAPECREATORS_API_KEY   your ScrapeCreators key
#   SUPABASE_URL             https://<project-ref>.supabase.co
#   SUPABASE_KEY             the service_role key
#   ANTHROPIC_API_KEY        for the joke-segmentation step (Claude API)

on:
  schedule:
    # every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:        # also runnable on demand from the Actions tab

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrapecreators.txt -r requirements-supabase.txt \
                      -r requirements-jokes.txt -r requirements-sentiment.txt

      - name: Ingest last week's videos (with replies)
        # --since-days 8 gives a 1-day overlap so nothing slips through the gap
        # between weekly runs; the upsert dedupes the overlap.
        run: |
          python src/loader.py --client emokid690 --all \
            --since-days 8 --with-replies \
            --comment-count 5000 --max-videos 100

      - name: Transcribe new videos (TikTok captions)
        run: python src/transcribe.py --client emokid690

      - name: Segment transcripts into jokes (Claude API)
        run: python src/segment_jokes.py --client emokid690

      - name: Attribute comments to jokes
        run: python src/attribute_jokes.py --client emokid690

      - name: Score comment sentiment
        run: python src/score_sentiment.py --client emokid690

      - name: Sync to Supabase
        run: python src/sync_supabase.py --client emokid690

      - name: Summary
        run: python src/query.py --client emokid690
